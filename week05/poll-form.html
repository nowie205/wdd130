<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header></header>
    <main>
        <form action="">
            <p>Contact Information</p>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>

            <!-- <label>Full Name: <input type="text" name="fullname" required></label>
            <label>Email: <input type="email" name="useremail" required></label> -->

            <p>Questions</p>
            <label for="browser">What is your favorite browser?</label>
            <select name="browser" id="browser">
                <option value="chrome">Google Chrome</option>
                <option value="edge">Microsoft Edge</option>
                <option value="firefox">Firefox</option>
                <option value="brave">Brave</option>
                <option value="other">Other</option>
            </select>

            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">

            <label for="feedback">List the places you have lived:</label>
            <textarea name="feedback" id="feedback" rows="5"
              placeholder="Mombasa, Stillwater, Diani, Malindi, Mambrui" rows="5"></textarea>

            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>©️ 2026 | HTML Form | Noel Bilauni</p>
    </footer>
</body>

</html>
