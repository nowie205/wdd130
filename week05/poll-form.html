<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header></header>
    <main>
        <form action="">
            <p>Contact Information</p>
            <p><label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </p>

            <p><label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" required>
            </p>

            <!-- <label>Full Name: <input type="text" name="fullname" required></label>
            <label>Email: <input type="email" name="useremail" required></label> -->

            <p>Questions</p>
            <p><label for="browser">What is your favorite browser?</label>
                <select name="browser" id="browser">
                    <option value="chrome">Google Chrome</option>
                    <option value="edge">Microsoft Edge</option>
                    <option value="firefox">Firefox</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>
            </p>

            <p><label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </p>

            <p><label for="feedback">List the places you have lived:</label>
                <textarea name="feedback" id="feedback" rows="5"
                  placeholder="Mombasa, Stillwater, Diani"></textarea>
            </p>

            <p><button type="submit">Submit Poll</button></p>

        </form>
    </main>
    <footer>
        <p>©️ 2026 | HTML Form | Noel Bilauni</p>
    </footer>
</body>

</html>
