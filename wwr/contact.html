<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme Current Adventures - Contact Us Page</title>
    <meta name="description" content="Learn about our passion
      for safe thrilling whitewater rafting, where we are located, bookings and how to 
      contact us.">
    <meta name="author" content="Noel Bilauni">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="grid">
        <img src="images/rafting-logo.png" alt="Rafting Logo">
        <nav>
            <ul class="flex">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html" class="active">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <div class="contacts">
            <h1>Extreme Current Adventures</h1>
            <address>
                <p>9008 Tromsø</p>
                <p>Norway</p>
                <p>+47 41234567</p>
                <p>info@currentadventures.com</p>
            </address>
        </div>
        <div class="mapandform">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1956.9506871121591!2d6.4030872!3d60.6274592!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2ske!4v1785958128702!5m2!1sen!2ske"
              width="400" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
            <div class="form">
                <form action="#">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Rhoda Kigen" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label>Message<br>Purpose</label>

                    <div class="radio-group">
                        <label for="general-inquiry">
                            <input type="radio" id="general-inquiry" name="purpose" value="general"
                              required>
                            General Inquiry
                        </label>

                        <label for="reservation-question">
                            <input type="radio" id="reservation-question" name="purpose"
                              value="reservation">
                            Reservation Question
                        </label>

                        <label for="website-suggestion">
                            <input type="radio" id="website-suggestion" name="purpose"
                              value="suggestion">
                            Website Suggestion
                        </label>
                    </div>

                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="4"
                      placeholder="Type here"></textarea>

                    <div class="checkbox">
                        <input type="checkbox" id="newsletter" name="newsletter" checked>
                        <label for="newsletter">Please subscribe to the monthly newsletter</label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </div>

        <div class="profiles">
            <h2 class="h2contacts">We Are Here to Serve You</h2>
            <figure>
                <img src="images/employees-image.jpg" alt="Employees Image">
                <figcaption>Safety Instructors</figcaption>
            </figure>
            <figure>
                <img src="images/employees-profile.jpg" alt="Employees Profile">
                <figcaption>Equipment Managers</figcaption>
            </figure>
            <figure>
                <img src="images/happy-employees-image.jpg" alt="Happy Employees">
                <figcaption>Lead River Guides</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <div class="footerleft"></div>
        <p class="gridp">©️ 2026 💦 Exploring Waters Adventures 💦 Noel Bilauni</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook-icon.png" alt="Facebook"></a>
            <a href="https://linkedin.com"><img src="images/linkedin-icon.png" alt="Linkedin"></a>
            <a href="https://instagram.com"><img src="images/instagram-icon.png"
                  alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
